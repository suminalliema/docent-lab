# 실험 설정 — 무료 구성 (2026-11-23 기준)
#   - Gemini: Google AI Studio 무료 등급 API (카드 등록 없이 키 발급)
#   - Gemma, Qwen: 내 맥에서 Ollama로 돌리는 오픈소스 모델 (완전 무료, 인터넷 불필요)
# 모델 이름 확인:
#   Gemini: https://ai.google.dev/gemini-api/docs/models
#   Ollama: https://ollama.com/search?c=vision
#   OpenAI: https://platform.openai.com/docs/models
#   Anthropic: https://docs.claude.com/en/docs/about-claude/models

# 해설을 생성할 모델 (provider: google | ollama | openai | anthropic)
generators:
  - name: gemini
    provider: google
    model: gemini-3.6-flash
  - name: gemma
    provider: ollama
    model: gemma3:12b
  - name: qwen
    provider: ollama
    model: qwen2.5vl:7b
  # 나중에 유료 API를 쓰게 되면 아래 줄의 # 을 지우고 .env에 키를 넣으세요.
  # - name: gpt
  #   provider: openai
  #   model: gpt-6.2-sol
  # - name: claude
  #   provider: anthropic
  #   model: claude-sonnet-5-5

# 해설 생성 프롬프트 (prompts/ 폴더 안 파일 이름, 확장자 제외)
prompts:
  - generate_v1_basic
  - generate_v2_guided

# 채점할 판정 모델. judge 이름의 앞부분(gemini-judge → gemini)이 generator 이름과 같으면
# '자기가 쓴 해설'로 보고 자기 선호 편향을 계산합니다.
judges:
  - name: gemini-judge
    provider: google
    model: gemini-3.5-flash-lite
  - name: gemma-judge
    provider: ollama
    model: gemma3:12b

judge_prompt: judge_v1
rubric_file: rubric.md

temperature: 0.3
max_tokens: 4000   # 최신 모델은 '생각(reasoning)' 토큰도 여기서 쓰므로 넉넉하게

# 무료 등급 분당 요청 한도에 걸리지 않게 같은 provider 호출 사이에 쉬는 시간(초).
# AI Studio의 Rate limit 화면에서 내 한도를 보고 조정하세요. (RPM 10이면 6초 이상)
min_interval_sec:
  google: 7
  ollama: 0
